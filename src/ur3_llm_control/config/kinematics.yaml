/**:
  ros__parameters:
    robot_description_kinematics:
      ur_manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        # Cho KDL du thoi gian tim nghiem gan seed hien tai. Timeout 5 ms cu
        # thuong cat Cartesian path giua chung va lam fallback doi nhanh IK.
        kinematics_solver_search_resolution: 0.002
        kinematics_solver_timeout: 0.05
        kinematics_solver_attempts: 10
